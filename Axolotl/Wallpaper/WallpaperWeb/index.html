<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { user-select: none; pointer-events: none; }
  #fallback, canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #fallback { opacity: 0; transition: opacity .4s ease; }
  canvas { opacity: 0; transition: opacity .6s ease; }
  canvas.ready { opacity: var(--intensity, 1); }
  #fallback.shown { opacity: var(--intensity, 1); }
  .burst { position: fixed; width: 240px; height: 240px; margin: -120px 0 0 -120px; border-radius: 50%;
    background: radial-gradient(closest-side, transparent 55%, var(--accent) 72%, transparent 100%);
    mix-blend-mode: screen; opacity: 0; animation: burst .7s ease-out; }
  @keyframes burst { from { transform: scale(.15); opacity: .55; } to { transform: scale(1.4); opacity: 0; } }
</style>
</head>
<body>
<div id="fallback"></div>
<canvas id="wall"></canvas>
<script type="module" src="wallpaper.js"></script>
</body>
</html>

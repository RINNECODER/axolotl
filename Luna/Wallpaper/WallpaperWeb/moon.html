<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { user-select: none; pointer-events: none; }
  #fallback, canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #fallback { opacity: 0; transition: opacity .4s ease; }
  canvas { opacity: 0; transition: opacity .6s ease; }
  canvas.ready { opacity: var(--intensity, 1); }
  #fallback.shown { opacity: var(--intensity, 1); }
</style>
</head>
<body>

<canvas id="moon"></canvas>
<script type="module" src="moon.js"></script>
</body>
</html>

name: Luna
options:
  bundleIdPrefix: com.luna
  deploymentTarget:
    macOS: "15.4"
  xcodeVersion: "26.2"
  defaultConfig: Release

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"
  LaTeXSwiftUI:
    url: https://github.com/colinc86/LaTeXSwiftUI
    from: "1.5.0"
  # Dev mode's raw terminal. 1.10.1: the last release without a build-tool plugin
  # (later ones need -skipPackagePluginValidation / a trust prompt to build).
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.10.1"

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

# Shared by the sandboxed Luna app and the unsandboxed Luna Dev variant.
targetTemplates:
  LunaApp:
    type: application
    platform: macOS
    sources:
      - path: Luna
        excludes:
          - Resources/README_NOT_RESOURCES.md
          - BuiltInExtensions/**
          - Wallpaper/WallpaperWeb/**
      # Shipped as a folder (structure intact) so WebKit can load the extensions.
      - path: Luna/BuiltInExtensions
        type: folder
        buildPhase: resources
      # Start page wallpaper shaders (bundled WebGPU page, loaded offline).
      - path: Luna/Wallpaper/WallpaperWeb
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Luna
        PRODUCT_BUNDLE_IDENTIFIER: com.luna.browser
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: 3
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Luna/Luna.entitlements
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Luna
        INFOPLIST_KEY_CFBundleName: Luna
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSCameraUsageDescription: "Luna needs camera access for websites that request it."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Luna needs microphone access for websites that request it."
        INFOPLIST_KEY_NSLocationUsageDescription: "Luna shares your location with websites you allow."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "Luna needs access to Downloads to save files."
        ENABLE_APP_SANDBOX: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: YES # Loopback listener for "Sign in with ChatGPT" (127.0.0.1 only)
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES # TODO: Enable this when we have a way to handle outgoing network connections
        ENABLE_PREVIEWS: YES
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES # TODO: Enable this when we have a way to handle audio input
        ENABLE_RESOURCE_ACCESS_BLUETOOTH: NO
        ENABLE_RESOURCE_ACCESS_CALENDARS: NO # TODO: Enable this when we have a way to handle calendars
        ENABLE_RESOURCE_ACCESS_CAMERA: YES # TODO: Enable this when we have a way to handle camera
        ENABLE_RESOURCE_ACCESS_CONTACTS: NO # TODO: Enable this when we have a way to handle contacts
        ENABLE_RESOURCE_ACCESS_LOCATION: YES # Sites ask first (SitePermissions, macOS 27+)
        ENABLE_RESOURCE_ACCESS_PRINTING: YES
        ENABLE_RESOURCE_ACCESS_USB: NO
        ENABLE_USER_SELECTED_FILES: readwrite # Save panels, e.g. Save as PDF from the print dialog
        ENABLE_FILE_ACCESS_DOWNLOADS_FOLDER: readwrite # Save downloads to ~/Downloads
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_IDENTITY: "Apple Development"
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    dependencies:
      - package: MarkdownUI
      - package: LaTeXSwiftUI
      # SwiftTerm is linked by both apps: Dev code (DevTerminalController / DevSession, which LunaTests
      # also exercise) shares sources, and the Dev mode UI is gated at runtime, not with #if LUNA_DEV.
      # Moving it to LunaDev alone needs a terminal abstraction first.
      - package: SwiftTerm
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig

targets:
  Luna:
    templates: [LunaApp]

  # Unsandboxed build for Dev mode (drives the claude / codex CLIs). Same sources;
  # separate bundle id so it never shares the sandboxed app's container or settings.
  LunaDev:
    templates: [LunaApp]
    settings:
      base:
        PRODUCT_NAME: Luna Dev
        PRODUCT_MODULE_NAME: LunaDev
        PRODUCT_BUNDLE_IDENTIFIER: com.luna.browser.dev
        INFOPLIST_KEY_CFBundleDisplayName: Luna Dev
        INFOPLIST_KEY_CFBundleName: Luna Dev
        ENABLE_APP_SANDBOX: NO
        # Its own keychain access group: the default one is tied to com.luna.browser.
        CODE_SIGN_ENTITLEMENTS: Luna/LunaDev.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "LUNA_DEV $(inherited)"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "LUNA_DEV $(inherited)"

  LunaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LunaTests
    dependencies:
      - target: Luna
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  # Dev tests hosted by the unsandboxed LunaDev app, so process-spawning tests can run.
  LunaDevTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LunaTests
        includes:
          - "Dev*Tests.swift"
          - "CLIFixtures.swift"
    dependencies:
      - target: LunaDev
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "LUNA_DEV $(inherited)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Luna Dev.app/Contents/MacOS/Luna Dev"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  LunaDev:
    build:
      targets:
        LunaDev: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LunaDevTests
